<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480">
  <!-- El fondo oscuro solo hace falta cuando el icono se pinta sobre claro
       (resultados de Google, pestana con tema claro). En modo oscuro se
       quita y la marca vuelve a flotar, como estaba antes. -->
  <style>
    .bg { fill: #06161d }
    @media (prefers-color-scheme: dark) { .bg { fill: none } }
  </style>
  <rect class="bg" width="480" height="480"/>
  <image x="101" y="136" width="278" height="208" href="data:image/png;base64,"/>
</svg>
