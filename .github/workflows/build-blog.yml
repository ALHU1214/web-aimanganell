name: Build blog

on:
  push:
    branches: [master]
    paths:
      - 'blog/posts/**'
      - 'scripts/build-blog.js'
      - 'scripts/sellar-assets.js'
      - 'scripts/post-template.html'
      - 'scripts/blog-index-template.html'
      # los cuatro que se sellan: si cambian hay que renovar su ?v= en el HTML
      - 'styles.css'
      - 'contraste-minimo.css'
      - 'main.js'
      - 'config.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # historial completo, no solo el último commit — build-blog.js
          # usa "git log" por archivo para calcular dateModified (JSON-LD)
          fetch-depth: 0

      - name: Instalar ffmpeg (comprime la portada y saca sus recortes)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Generar páginas del blog
        run: node scripts/build-blog.js

      # Va despues del build para sellar tambien las paginas recien generadas
      - name: Sellar CSS y JS con su hash
        run: node scripts/sellar-assets.js

      - name: Commit de las páginas generadas (si hay cambios)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog/ sitemap.xml robots.txt index.html consultoria/ legal/ scripts/
          if git diff --cached --quiet; then
            echo "Sin cambios en las páginas generadas."
            exit 0
          fi
          git commit -m "Genera blog desde blog/posts/ [skip ci]"
          # reintenta con rebase por si master avanzó entre el checkout
          # y este push (otro commit, otra ejecución en paralelo...)
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rechazado, reintentando con rebase ($i/5)…"
            git fetch origin master
            git rebase origin/master
            sleep $((i * 3))
          done
          echo "::error::No se pudo empujar tras 5 intentos."
          exit 1
